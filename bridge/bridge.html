<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DripWriter Mobile Bridge</title>
  <style>
    body { width: 360px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #f4f5f7; color: #101828; margin: 0; padding: 16px; }
    h1 { font-size: 17px; margin: 0 0 4px; }
    p { font-size: 11px; color: #667085; line-height: 1.5; margin: 0 0 12px; }
    label { display: block; font-size: 11px; font-weight: 700; margin: 10px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #d0d5dd;
            border-radius: 8px; font-family: inherit; font-size: 12px; }
    button { margin-top: 12px; width: 100%; padding: 10px; border: 0; border-radius: 8px;
             background: #4f46e5; color: #fff; font-weight: 700; cursor: pointer; font-size: 12px; }
    button:disabled { opacity: .5; cursor: default; }
    #log { margin-top: 12px; max-height: 170px; overflow: auto; background: #fff; border: 1px solid #e4e7ec;
           border-radius: 8px; padding: 8px; font-size: 10.5px; line-height: 1.6; color: #344054; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #98a2b3; margin-right: 5px; }
    .dot.on { background: #12b76a; }
  </style>
</head>
<body>
  <h1>DripWriter Mobile Bridge</h1>
  <p>Keep this page open on your laptop with the Google Doc in another tab. Your phone sends text here, and the existing DripWriter content script types it into the Doc.</p>

  <label for="code">Pairing code (same as on your phone)</label>
  <input id="code" placeholder="e.g. DW-4821" autocomplete="off" />

  <label for="server">Relay address</label>
  <input id="server" value="ws://localhost:8787" />

  <button id="connectBtn" type="button">Connect</button>
  <p id="tabLine" style="margin-top:10px">No active tab</p>
  <div id="log"><div><span class="dot" id="dot"></span>Not connected</div></div>

  <script src="bridge.js"></script>
</body>
</html>
